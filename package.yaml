name: effectful-cli
version: 0.0.0.0
license: GPL-3
author: drlkf
maintainer: drlkf <drlkf@drlkf.net>
copyright: 2026 drlkf
category: CLI
synopsis: CLI helpers for the effectful ecosystem
description: Please see the README.

extra-source-files:
  - README.md

extra-docs-files:
  - CHANGELOG.md

language: GHC2021

dependencies:
  - base >=4.20 && <4.22

ghc-options:
  - -Wall
  - -Wextra
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Data.CLI.Args
    - Data.CLI.Class
    - Data.CLI.Impl
    - Data.Error.CLI
    - Effectful.CLI
    - Effectful.CLI.Conc
    - Effectful.CLI.IO
    - Effectful.CLI.Sleep
    - Effectful.CLI.Time
    - Effectful.Logger

  dependencies:
    - effectful >=2.6.1 && <2.8
    - effectful-core >=2.6.1 && <2.8
    - hs-opentelemetry-api ^>=1.0
    - hs-opentelemetry-instrumentation-monad-logger ^>=1.0
    - http-client-effectful ^>=1.0
    - megaparsec ^>=9.7
    - monad-logger ^>=0.3.42
    - optparse-applicative >=0.18.1 && <0.20
    - table-layout ^>=1.0
    - text ^>=2.1
    - time >=1.12.2 && <1.15
    - uuid ^>=1.3.16

tests:
  effectful-cli-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - effectful-cli
      - effectful
      - hspec ^>=2.11
      - megaparsec
      - optparse-applicative
